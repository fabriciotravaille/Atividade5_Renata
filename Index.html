<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-size: 20px;
        }
        label, p{
            font-size: 30px;
        }
        p{
            margin-bottom: 8px;
        }
        h1{
            font-size: 50px;
            margin-bottom: 20px;~
            text-align: center;
        }
        input, select, textarea, button{
            border-radius: 7px;
        }
        input:focus, select:focus, textarea:focus{
            outline: none;
            border: 2px solid blue;
        }
        .esportes{
            margin: 7px;
        }
        form{
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 10px double gray;
            border-radius: 7px;
        }
        button{
            display: block;
            margin: 0 auto;
            padding: 8px 20px;
            cursor: pointer;
        }
        button:hover{
            background-color: blue;
            color: white;
        }
        @media (max-width: 500px){
            h1{
                font-size: 30px;
            }
            label, p{
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <h1>Atividade 5 de Formulários</h1>
    <form action="" method="get">
        <label for="nome"> Nome:</label>
            <input type="text" name="Nome" placeholder="Digite seu nome" id="nome">
        <br><br>
        <label for="email">Email:</label>
            <input type="email" name="Email" id="email" placeholder="Exemplo@email.com">
        <br><br>
        <label for="senha">Senha:</label>
            <input type="password" name="Senha" id="senha" placeholder="Digite sua senha">
        <br><br>
        <label for="data">Insira a sua data de nascimento: <br>
            <input type="date" name="Data" id="data">
        </label>
        <br><br>
        <p>Selecione seu gênero a baixo:</p>
            <input class="esportes" type="radio" name="genero" value="Feminino">Feminino <br>
            <input class="esportes" type="radio" name="genero" value="Masculino">Masculino <br><br>

        <p>Esportes preferidos:</p>
            <input class="esportes" type="checkbox" name="esporte" value="Futebol"> Futebol
            <input class="esportes" type="checkbox" name="esporte" value="Basquete"> Basquete
            <input class="esportes" type="checkbox" name="esporte" value="Tenis"> Tênis <br>
            <input class="esportes" type="checkbox" name="esporte" value="Golf"> Golf
            <input class="esportes" type="checkbox" name="esporte" value="Volei"> Vôlei
            <input class="esportes" type="checkbox" name="esporte" value="Natacao"> Natação
            <br><br>

        <label for="curso">Selecione seu curso a baixo:</label><br>
        <select name="Cursos" id="curso">
            <option value="">Escolha</option>
            <option value="Eng">Engenharia de software</option>
            <option value="Cien">Ciência da computação</option>
            <option value="Ed">Educação fisíca</option>
            <option value="Letras">Letras</option>
        </select>
        <br><br>
        <label for="foto">Upload de foto:</label><br>
        <input type="file" name="Arquivo" id="foto">
        <br><br>
        <label for="comentarios">Comentários:</label><br>
        <textarea name="Comentarios" id="comentarios"></textarea>
        <br><br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
